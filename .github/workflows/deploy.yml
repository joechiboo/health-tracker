# push 到 main 就自動 build 並發佈到 gh-pages 分支。
# Supabase 的兩個值放在 repo secret（Settings → Secrets and variables → Actions），
# 不用再靠某台電腦上的 .env——沒設好 secret 時 check:env 會直接讓這個 job 失敗，
# 不會默默發出一份「離線模式」的網站。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可以到 Actions 頁面手動按一下重發

permissions:
  contents: write # 要推 gh-pages 分支

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 確認有帶到 Supabase 設定
        run: npm run check:env

      - run: npm run build

      - name: 推上 gh-pages
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
